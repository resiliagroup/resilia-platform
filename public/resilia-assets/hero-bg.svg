<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F2EE"/>
      <stop offset="100%" stop-color="#EAE7E1"/>
    </linearGradient>
    <radialGradient id="teal-glow" cx="65%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#007A70" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#007A70" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="navy-glow" cx="15%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#0A1628" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A1628" stop-opacity="0"/>
    </radialGradient>
    <!-- Noise filter -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  
  <!-- Base -->
  <rect width="1200" height="800" fill="url(#grad1)"/>
  <!-- Glows -->
  <rect width="1200" height="800" fill="url(#teal-glow)"/>
  <rect width="1200" height="800" fill="url(#navy-glow)"/>
  
  <!-- Geometric grid lines -->
  <g stroke="#0A1628" stroke-width="0.5" opacity="0.04">
    <!-- Vertical lines -->
    <line x1="0" y1="0" x2="0" y2="800"/>
    <line x1="72" y1="0" x2="72" y2="800"/>
    <line x1="144" y1="0" x2="144" y2="800"/>
    <line x1="216" y1="0" x2="216" y2="800"/>
    <line x1="288" y1="0" x2="288" y2="800"/>
    <line x1="360" y1="0" x2="360" y2="800"/>
    <line x1="432" y1="0" x2="432" y2="800"/>
    <line x1="504" y1="0" x2="504" y2="800"/>
    <line x1="576" y1="0" x2="576" y2="800"/>
    <line x1="648" y1="0" x2="648" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/>
    <line x1="792" y1="0" x2="792" y2="800"/>
    <line x1="864" y1="0" x2="864" y2="800"/>
    <line x1="936" y1="0" x2="936" y2="800"/>
    <line x1="1008" y1="0" x2="1008" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/>
    <line x1="1152" y1="0" x2="1152" y2="800"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="72" x2="1200" y2="72"/>
    <line x1="0" y1="144" x2="1200" y2="144"/>
    <line x1="0" y1="216" x2="1200" y2="216"/>
    <line x1="0" y1="288" x2="1200" y2="288"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="432" x2="1200" y2="432"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="0" y1="576" x2="1200" y2="576"/>
    <line x1="0" y1="648" x2="1200" y2="648"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
  </g>
  
  <!-- Decorative geometric shapes -->
  <!-- Large circle outline top-right -->
  <circle cx="1050" cy="120" r="220" fill="none" stroke="#007A70" stroke-width="1" opacity="0.06"/>
  <circle cx="1050" cy="120" r="160" fill="none" stroke="#007A70" stroke-width="0.5" opacity="0.05"/>
  <!-- Small circle bottom-left -->
  <circle cx="120" cy="680" r="100" fill="none" stroke="#0A1628" stroke-width="1" opacity="0.04"/>
  <!-- Diamond shape -->
  <polygon points="900,300 950,380 900,460 850,380" fill="none" stroke="#007A70" stroke-width="1" opacity="0.05"/>
  <!-- Cross marks at grid intersections -->
  <g stroke="#0A1628" stroke-width="0.8" opacity="0.06">
    <line x1="358" y1="214" x2="362" y2="218"/><line x1="362" y1="214" x2="358" y2="218"/>
    <line x1="718" y1="142" x2="722" y2="146"/><line x1="722" y1="142" x2="718" y2="146"/>
    <line x1="1006" y1="358" x2="1010" y2="362"/><line x1="1010" y1="358" x2="1006" y2="362"/>
    <line x1="576" y1="504" x2="580" y2="508"/><line x1="580" y1="504" x2="576" y2="508"/>
    <line x1="214" y1="430" x2="218" y2="434"/><line x1="218" y1="430" x2="214" y2="434"/>
  </g>
</svg>