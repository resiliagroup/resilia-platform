<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0F2448"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- BG -->
  <rect width="500" height="500" fill="#F4F2EE" rx="20"/>
  
  <!-- Title -->
  <text x="250" y="38" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#0A1628" text-anchor="middle">BCM Yaşam Döngüsü</text>
  <text x="250" y="54" font-family="sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle" letter-spacing="1.5">ISO 22301 UYUMLU SÜREÇ MODELİ</text>
  
  <!-- Center circle -->
  <circle cx="250" cy="270" r="52" fill="url(#ng)"/>
  <text x="250" y="265" font-family="Georgia,serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">RESILIA</text>
  <text x="250" y="282" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle">Merkezi Platform</text>

  <!-- Orbital ring -->
  <circle cx="250" cy="270" r="130" fill="none" stroke="#EAE7E1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 6 nodes around the ring -->
  <!-- 1. Risk Değerlendirme — top -->
  <circle cx="250" cy="140" r="42" fill="white" stroke="#C13030" stroke-width="1.5"/>
  <text x="250" y="134" font-family="Georgia,serif" font-size="10" font-weight="700" fill="#C13030" text-anchor="middle">Risk</text>
  <text x="250" y="148" font-family="sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Değerlendirme</text>
  
  <!-- 2. BIA — top-right -->
  <circle cx="363" cy="200" r="42" fill="white" stroke="#A85C00" stroke-width="1.5"/>
  <text x="363" y="196" font-family="Georgia,serif" font-size="11" font-weight="700" fill="#A85C00" text-anchor="middle">BIA</text>
  <text x="363" y="210" font-family="sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Etki Analizi</text>
  
  <!-- 3. Planlama — bottom-right -->
  <circle cx="363" cy="340" r="42" fill="white" stroke="#007A70" stroke-width="1.5"/>
  <text x="363" y="334" font-family="Georgia,serif" font-size="10" font-weight="700" fill="#007A70" text-anchor="middle">Kurtarma</text>
  <text x="363" y="348" font-family="sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Planlaması</text>
  
  <!-- 4. Tatbikat — bottom -->
  <circle cx="250" cy="400" r="42" fill="white" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="250" y="394" font-family="Georgia,serif" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="middle">Tatbikat</text>
  <text x="250" y="408" font-family="sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Kriz Yönetimi</text>
  
  <!-- 5. İyileştirme — bottom-left -->
  <circle cx="137" cy="340" r="42" fill="white" stroke="#0369A1" stroke-width="1.5"/>
  <text x="137" y="334" font-family="Georgia,serif" font-size="10" font-weight="700" fill="#0369A1" text-anchor="middle">Sürekli</text>
  <text x="137" y="348" font-family="sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">İyileştirme</text>
  
  <!-- 6. Yönetişim — top-left -->
  <circle cx="137" cy="200" r="42" fill="white" stroke="#B45309" stroke-width="1.5"/>
  <text x="137" y="196" font-family="Georgia,serif" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">Yönetişim</text>
  <text x="137" y="210" font-family="sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Gözetim</text>

  <!-- Arrows on ring (arc path approximations) -->
  <g stroke="#007A70" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 270 141 Q 340 155 352 180" marker-end="url(#arr)"/>
    <path d="M 375 220 Q 392 270 375 320" marker-end="url(#arr)"/>
    <path d="M 352 358 Q 315 390 280 398" marker-end="url(#arr)"/>
    <path d="M 220 400 Q 175 395 157 365" marker-end="url(#arr)"/>
    <path d="M 127 320 Q 115 270 127 220" marker-end="url(#arr)"/>
    <path d="M 148 183 Q 185 152 228 143" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#007A70" opacity="0.6"/>
    </marker>
  </defs>
  
  <!-- ISO badge -->
  <rect x="186" y="460" width="128" height="24" rx="12" fill="#0A1628"/>
  <text x="250" y="476" font-family="sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="0.5">ISO 22301 · Sendai Çerçevesi</text>
</svg>