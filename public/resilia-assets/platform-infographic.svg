<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'DM Sans', sans-serif">
  <defs>
    <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/><stop offset="100%" stop-color="#0D1E3A"/>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007A70"/><stop offset="100%" stop-color="#00C4B0"/>
    </linearGradient>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0A1628" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="560" height="320" fill="url(#ng)" rx="18"/>
  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="560" y2="80"/><line x1="0" y1="160" x2="560" y2="160"/>
    <line x1="0" y1="240" x2="560" y2="240"/>
    <line x1="140" y1="0" x2="140" y2="320"/><line x1="280" y1="0" x2="280" y2="320"/>
    <line x1="420" y1="0" x2="420" y2="320"/>
  </g>
  <!-- Teal glow -->
  <radialGradient id="glow" cx="75%" cy="30%" r="40%">
    <stop offset="0%" stop-color="#007A70" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#007A70" stop-opacity="0"/>
  </radialGradient>
  <rect width="560" height="320" rx="18" fill="url(#glow)"/>

  <!-- Header -->
  <text x="28" y="38" fill="white" font-size="16" font-weight="700" font-family="Georgia,serif">Platform Mimarisi</text>
  <text x="28" y="54" fill="rgba(255,255,255,0.3)" font-size="9" letter-spacing="1.5">RESILIA · UÇTAN UCA DAYANIKLILIK YÖNETİMİ</text>
  <!-- Teal accent line -->
  <rect x="28" y="62" width="40" height="2" rx="1" fill="url(#tg)"/>

  <!-- 4 modül kartları -->
  <!-- MOD 1: Risk -->
  <rect x="28" y="80" width="118" height="220" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(193,48,48,0.4)" stroke-width="1"/>
  <rect x="28" y="80" width="118" height="3" rx="1.5" fill="#C13030"/>
  <!-- Risk icon -->
  <circle cx="87" cy="118" r="22" fill="rgba(193,48,48,0.12)" stroke="rgba(193,48,48,0.3)" stroke-width="1"/>
  <!-- Target/scope lines -->
  <circle cx="87" cy="118" r="14" fill="none" stroke="#C13030" stroke-width="1" opacity="0.5"/>
  <circle cx="87" cy="118" r="7" fill="none" stroke="#C13030" stroke-width="1.5" opacity="0.8"/>
  <circle cx="87" cy="118" r="2.5" fill="#C13030"/>
  <line x1="87" y1="96" x2="87" y2="140" stroke="#C13030" stroke-width="0.75" opacity="0.3"/>
  <line x1="65" y1="118" x2="109" y2="118" stroke="#C13030" stroke-width="0.75" opacity="0.3"/>
  <!-- Text -->
  <text x="87" y="156" fill="rgba(255,255,255,0.5)" font-size="8" letter-spacing="1" text-anchor="middle">01 · RİSK</text>
  <text x="87" y="172" fill="white" font-size="12" font-weight="700" font-family="Georgia,serif" text-anchor="middle">HFE-360</text>
  <text x="87" y="186" fill="white" font-size="10" font-weight="600" text-anchor="middle">Değerlendirme</text>
  <text x="87" y="210" fill="rgba(255,255,255,0.35)" font-size="9" text-anchor="middle">Tehlike · Kırılganlık</text>
  <text x="87" y="223" fill="rgba(255,255,255,0.35)" font-size="9" text-anchor="middle">Kapasite · 0–100</text>
  <!-- Mini bar -->
  <rect x="42" y="268" width="90" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="42" y="268" width="65" height="4" rx="2" fill="#C13030"/>
  <text x="87" y="284" fill="#C13030" font-size="9" font-weight="600" text-anchor="middle">72 / 100</text>

  <!-- MOD 2: BIA -->
  <rect x="158" y="80" width="118" height="220" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(168,92,0,0.4)" stroke-width="1"/>
  <rect x="158" y="80" width="118" height="3" rx="1.5" fill="#A85C00"/>
  <!-- BIA icon: bar chart -->
  <g transform="translate(165,96)">
    <rect x="8" y="28" width="10" height="18" rx="2" fill="rgba(168,92,0,0.3)" stroke="#A85C00" stroke-width="1"/>
    <rect x="22" y="18" width="10" height="28" rx="2" fill="rgba(168,92,0,0.5)" stroke="#A85C00" stroke-width="1"/>
    <rect x="36" y="8" width="10" height="38" rx="2" fill="#A85C00" opacity="0.8"/>
    <rect x="50" y="22" width="10" height="24" rx="2" fill="rgba(168,92,0,0.4)" stroke="#A85C00" stroke-width="1"/>
    <line x1="4" y1="46" x2="64" y2="46" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  </g>
  <text x="217" y="156" fill="rgba(255,255,255,0.5)" font-size="8" letter-spacing="1" text-anchor="middle">02 · BIA</text>
  <text x="217" y="172" fill="white" font-size="12" font-weight="700" font-family="Georgia,serif" text-anchor="middle">İş Etki</text>
  <text x="217" y="186" fill="white" font-size="10" font-weight="600" text-anchor="middle">Analizi</text>
  <text x="217" y="210" fill="rgba(255,255,255,0.35)" font-size="9" text-anchor="middle">RTO · RPO · EAL</text>
  <text x="217" y="223" fill="rgba(255,255,255,0.35)" font-size="9" text-anchor="middle">ROI Aksiyon Matris</text>
  <rect x="172" y="268" width="90" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="172" y="268" width="52" height="4" rx="2" fill="#A85C00"/>
  <text x="217" y="284" fill="#A85C00" font-size="9" font-weight="600" text-anchor="middle">₺34.4M EAL</text>

  <!-- MOD 3: Uyum -->
  <rect x="288" y="80" width="118" height="220" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(0,122,112,0.4)" stroke-width="1"/>
  <rect x="288" y="80" width="118" height="3" rx="1.5" fill="#007A70"/>
  <!-- Uyum icon: checkmarks -->
  <g transform="translate(297,96)">
    <rect x="0" y="0" width="100" height="14" rx="3" fill="rgba(0,122,112,0.15)" stroke="rgba(0,122,112,0.3)" stroke-width="0.75"/>
    <polyline points="4,7 7,10 12,4" stroke="#007A70" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="18" y="10" fill="rgba(255,255,255,0.6)" font-size="8">BDDK 26333</text>
    <rect x="0" y="18" width="100" height="14" rx="3" fill="rgba(0,122,112,0.15)" stroke="rgba(0,122,112,0.3)" stroke-width="0.75"/>
    <polyline points="4,25 7,28 12,22" stroke="#007A70" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="18" y="28" fill="rgba(255,255,255,0.6)" font-size="8">ISO 22301</text>
    <rect x="0" y="36" width="100" height="14" rx="3" fill="rgba(0,122,112,0.08)" stroke="rgba(0,122,112,0.2)" stroke-width="0.75"/>
    <text x="18" y="46" fill="rgba(255,255,255,0.3)" font-size="8">Seveso III</text>
  </g>
  <text x="347" y="156" fill="rgba(255,255,255,0.5)" font-size="8" letter-spacing="1" text-anchor="middle">03 · UYUM</text>
  <text x="347" y="172" fill="white" font-size="12" font-weight="700" font-family="Georgia,serif" text-anchor="middle">Düzenleyici</text>
  <text x="347" y="186" fill="white" font-size="10" font-weight="600" text-anchor="middle">Uyum Takibi</text>
  <text x="347" y="210" fill="rgba(255,255,255,0.35)" font-size="9" text-anchor="middle">Otomatik eşleştirme</text>
  <text x="347" y="223" fill="rgba(255,255,255,0.35)" font-size="9" text-anchor="middle">Boşluk analizi</text>
  <rect x="302" y="268" width="90" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="302" y="268" width="81" height="4" rx="2" fill="#007A70"/>
  <text x="347" y="284" fill="#00C4B0" font-size="9" font-weight="600" text-anchor="middle">%90 uyum</text>

  <!-- MOD 4: Kriz -->
  <rect x="418" y="80" width="118" height="220" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(109,40,217,0.4)" stroke-width="1"/>
  <rect x="418" y="80" width="118" height="3" rx="1.5" fill="#6D28D9"/>
  <!-- Kriz icon: uyarı + bağlantı -->
  <g transform="translate(427,96)">
    <polygon points="50,4 94,46 6,46" fill="none" stroke="#6D28D9" stroke-width="1.5" opacity="0.6"/>
    <polygon points="50,10 88,44 12,44" fill="rgba(109,40,217,0.12)"/>
    <text x="50" y="36" fill="#6D28D9" font-size="22" font-weight="900" text-anchor="middle" font-family="Georgia,serif">!</text>
  </g>
  <text x="477" y="156" fill="rgba(255,255,255,0.5)" font-size="8" letter-spacing="1" text-anchor="middle">04 · KRİZ</text>
  <text x="477" y="172" fill="white" font-size="12" font-weight="700" font-family="Georgia,serif" text-anchor="middle">Kriz</text>
  <text x="477" y="186" fill="white" font-size="10" font-weight="600" text-anchor="middle">Koordinasyonu</text>
  <text x="477" y="210" fill="rgba(255,255,255,0.35)" font-size="9" text-anchor="middle">Gerçek zamanlı</text>
  <text x="477" y="223" fill="rgba(255,255,255,0.35)" font-size="9" text-anchor="middle">Komuta merkezi</text>
  <rect x="432" y="268" width="90" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="432" y="268" width="45" height="4" rx="2" fill="#6D28D9"/>
  <text x="477" y="284" fill="#A78BFA" font-size="9" font-weight="600" text-anchor="middle">7/24 izleme</text>

  <!-- Connecting arrows between modules -->
  <g fill="#007A70" opacity="0.4">
    <polygon points="148,192 155,188 155,196"/>
    <polygon points="278,192 285,188 285,196"/>
    <polygon points="408,192 415,188 415,196"/>
  </g>
</svg>