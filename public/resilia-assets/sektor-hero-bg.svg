<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <linearGradient id="navy-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="60%" stop-color="#0D1E3A"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <radialGradient id="accent" cx="75%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#1B4FD8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1B4FD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal-a" cx="20%" cy="80%" r="30%">
      <stop offset="0%" stop-color="#007A70" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#007A70" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#navy-h)"/>
  <rect width="1200" height="480" fill="url(#accent)"/>
  <rect width="1200" height="480" fill="url(#teal-a)"/>
  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
    <line x1="1000" y1="0" x2="1000" y2="480"/>
  </g>
  <!-- Large decorative ring -->
  <circle cx="950" cy="240" r="260" fill="none" stroke="rgba(27,79,216,0.08)" stroke-width="1.5"/>
  <circle cx="950" cy="240" r="180" fill="none" stroke="rgba(27,79,216,0.06)" stroke-width="1"/>
  <circle cx="950" cy="240" r="100" fill="none" stroke="rgba(27,79,216,0.1)" stroke-width="1"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="480" fill="rgba(27,79,216,0.5)"/>
  <!-- Bottom fade -->
  <rect width="1200" height="80" y="400" fill="url(#navy-h)" opacity="0.6"/>
</svg>