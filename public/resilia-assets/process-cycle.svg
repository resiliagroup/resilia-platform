<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F2EE"/><stop offset="100%" stop-color="#EAE7E1"/>
    </linearGradient>
    <linearGradient id="tg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007A70"/><stop offset="100%" stop-color="#00C4B0"/>
    </linearGradient>
  </defs>
  <rect width="520" height="280" rx="16" fill="url(#bg2)"/>

  <!-- Header -->
  <text x="26" y="34" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#0A1628">BCM Süreç Modeli</text>
  <text x="26" y="50" font-family="sans-serif" font-size="8.5" fill="#A09A92" letter-spacing="1.4">ISO 22301 UYUMLU · 6 AŞAMALI YAŞAM DÖNGÜSÜ</text>
  <rect x="26" y="57" width="36" height="2" rx="1" fill="url(#tg2)"/>

  <!-- 6 step nodes — horizontal with arrows -->
  <!-- Step positions: x = 46,126,206,286,366,446 / y = 140 -->

  <!-- Connector line -->
  <line x1="46" y1="140" x2="474" y2="140" stroke="#EAE7E1" stroke-width="2"/>

  <!-- Step 1: Risk -->
  <circle cx="46" cy="140" r="22" fill="white" stroke="#C13030" stroke-width="2"/>
  <!-- Target icon small -->
  <circle cx="46" cy="140" r="10" fill="none" stroke="#C13030" stroke-width="1.5" opacity="0.5"/>
  <circle cx="46" cy="140" r="5" fill="none" stroke="#C13030" stroke-width="1.5"/>
  <circle cx="46" cy="140" r="2" fill="#C13030"/>
  <text x="46" y="176" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#C13030" text-anchor="middle">Risk</text>
  <text x="46" y="187" font-family="sans-serif" font-size="7.5" fill="#7C766E" text-anchor="middle">Değerlendirme</text>
  <text x="46" y="100" font-family="'DM Mono',monospace" font-size="8" fill="#C13030" text-anchor="middle" opacity="0.7">01</text>

  <!-- Arrow 1→2 -->
  <polygon points="78,137 85,140 78,143" fill="#007A70" opacity="0.4"/>

  <!-- Step 2: BIA -->
  <circle cx="126" cy="140" r="22" fill="white" stroke="#A85C00" stroke-width="2"/>
  <!-- Bar chart small -->
  <rect x="116" y="146" width="5" height="8" rx="1" fill="#A85C00" opacity="0.5"/>
  <rect x="123" y="140" width="5" height="14" rx="1" fill="#A85C00" opacity="0.8"/>
  <rect x="130" y="134" width="5" height="20" rx="1" fill="#A85C00"/>
  <text x="126" y="176" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#A85C00" text-anchor="middle">BIA</text>
  <text x="126" y="187" font-family="sans-serif" font-size="7.5" fill="#7C766E" text-anchor="middle">Etki Analizi</text>
  <text x="126" y="100" font-family="'DM Mono',monospace" font-size="8" fill="#A85C00" text-anchor="middle" opacity="0.7">02</text>

  <!-- Arrow 2→3 -->
  <polygon points="158,137 165,140 158,143" fill="#007A70" opacity="0.4"/>

  <!-- Step 3: Strateji (active) -->
  <circle cx="206" cy="140" r="22" fill="#007A70"/>
  <!-- Document icon -->
  <rect x="197" y="131" width="18" height="20" rx="2" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
  <line x1="200" y1="136" x2="212" y2="136" stroke="white" stroke-width="1.2" opacity="0.8"/>
  <line x1="200" y1="140" x2="212" y2="140" stroke="white" stroke-width="1.2" opacity="0.8"/>
  <line x1="200" y1="144" x2="208" y2="144" stroke="white" stroke-width="1.2" opacity="0.5"/>
  <text x="206" y="176" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#007A70" text-anchor="middle">Strateji</text>
  <text x="206" y="187" font-family="sans-serif" font-size="7.5" fill="#7C766E" text-anchor="middle">&amp; Planlama</text>
  <text x="206" y="100" font-family="'DM Mono',monospace" font-size="8" fill="#007A70" text-anchor="middle" opacity="0.7">03</text>
  <!-- Active indicator -->
  <circle cx="206" cy="140" r="26" fill="none" stroke="#007A70" stroke-width="1" opacity="0.25"/>

  <!-- Arrow 3→4 -->
  <polygon points="238,137 245,140 238,143" fill="#007A70" opacity="0.4"/>

  <!-- Step 4: Uygulama -->
  <circle cx="286" cy="140" r="22" fill="white" stroke="#0369A1" stroke-width="2"/>
  <!-- Gear icon small -->
  <circle cx="286" cy="140" r="9" fill="none" stroke="#0369A1" stroke-width="2"/>
  <circle cx="286" cy="140" r="4" fill="#0369A1" opacity="0.6"/>
  <rect x="284" y="128" width="4" height="5" rx="1" fill="#0369A1"/>
  <rect x="284" y="147" width="4" height="5" rx="1" fill="#0369A1"/>
  <rect x="273" y="138" width="5" height="4" rx="1" fill="#0369A1"/>
  <rect x="294" y="138" width="5" height="4" rx="1" fill="#0369A1"/>
  <text x="286" y="176" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#0369A1" text-anchor="middle">Uygulama</text>
  <text x="286" y="187" font-family="sans-serif" font-size="7.5" fill="#7C766E" text-anchor="middle">Görev &amp; Kaynak</text>
  <text x="286" y="100" font-family="'DM Mono',monospace" font-size="8" fill="#0369A1" text-anchor="middle" opacity="0.7">04</text>

  <!-- Arrow 4→5 -->
  <polygon points="318,137 325,140 318,143" fill="#007A70" opacity="0.4"/>

  <!-- Step 5: Tatbikat -->
  <circle cx="366" cy="140" r="22" fill="white" stroke="#6D28D9" stroke-width="2"/>
  <!-- Alert triangle -->
  <polygon points="366,126 378,152 354,152" fill="none" stroke="#6D28D9" stroke-width="1.5" opacity="0.6"/>
  <text x="366" y="148" font-family="Georgia,serif" font-size="16" font-weight="900" fill="#6D28D9" text-anchor="middle">!</text>
  <text x="366" y="176" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#6D28D9" text-anchor="middle">Tatbikat</text>
  <text x="366" y="187" font-family="sans-serif" font-size="7.5" fill="#7C766E" text-anchor="middle">&amp; Test</text>
  <text x="366" y="100" font-family="'DM Mono',monospace" font-size="8" fill="#6D28D9" text-anchor="middle" opacity="0.7">05</text>

  <!-- Arrow 5→6 -->
  <polygon points="398,137 405,140 398,143" fill="#007A70" opacity="0.4"/>

  <!-- Step 6: İyileştirme -->
  <circle cx="474" cy="140" r="22" fill="white" stroke="#B45309" stroke-width="2"/>
  <!-- Refresh/cycle arrows -->
  <path d="M464 132 A14 14 0 0 1 484 132" stroke="#B45309" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="486,130 484,138 478,133" fill="#B45309"/>
  <path d="M484 148 A14 14 0 0 1 464 148" stroke="#B45309" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="462,150 464,142 470,147" fill="#B45309"/>
  <text x="474" y="176" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#B45309" text-anchor="middle">İyileştirme</text>
  <text x="474" y="187" font-family="sans-serif" font-size="7.5" fill="#7C766E" text-anchor="middle">Sürekli Gelişim</text>
  <text x="474" y="100" font-family="'DM Mono',monospace" font-size="8" fill="#B45309" text-anchor="middle" opacity="0.7">06</text>

  <!-- Return arc at bottom -->
  <path d="M474 165 Q260 250 46 165" stroke="url(#tg2)" stroke-width="1" fill="none" stroke-dasharray="4 3" opacity="0.35"/>
  <polygon points="44,162 50,165 44,168" fill="#007A70" opacity="0.4"/>

  <!-- Footer -->
  <rect x="26" y="255" width="468" height="18" rx="9" fill="rgba(10,22,40,0.05)"/>
  <text x="260" y="267" font-family="sans-serif" font-size="8.5" fill="#7C766E" text-anchor="middle" letter-spacing="0.5">ISO 22301 · Sendai Çerçevesi · HFE-360 Metodolojisi · İTÜ AYM</text>
</svg>